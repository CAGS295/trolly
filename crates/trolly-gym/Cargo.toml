[package]
name = "trolly-gym"
version = "0.1.0"
edition = "2021"

[dependencies]
trolly-strategy = { path = "../trolly-strategy" }
trolly-stream = { path = "../trolly-stream" }
tch = { version = "0.16", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false }

[features]
default = []
torch = ["dep:tch"]

[dev-dependencies]
trolly-strategy = { path = "../trolly-strategy" }

[[test]]
name = "train_loop"
required-features = ["torch"]

[[example]]
name = "matrix_train_snapshots"
required-features = ["torch"]

[[example]]
name = "microstructure_train_snapshots"
required-features = ["torch"]

[[test]]
name = "microstructure_train"
required-features = ["torch"]

[[bin]]
name = "gpu_train_orchestrator"
path = "src/bin/gpu_train_orchestrator.rs"
required-features = ["torch"]
